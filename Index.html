<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pro Heart Animation</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #heartCanvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease-in-out;
        }

        .beating {
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0% {
                transform: translate(-50%, -50%) scale(1);
            }

            15% {
                transform: translate(-50%, -50%) scale(1.05);
            }

            30% {
                transform: translate(-50%, -50%) scale(1);
            }

            45% {
                transform: translate(-50%, -50%) scale(1.05);
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .btn-wrapper {
            position: absolute;
            bottom: 60px;
            z-index: 10;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        button {
            padding: 16px 45px;
            font-size: 16px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: all 0.4s ease;
            outline: none;
        }

        button:hover {
            background: rgba(255, 26, 85, 0.15);
            border-color: rgba(255, 26, 85, 0.5);
            box-shadow: 0 0 25px rgba(255, 26, 85, 0.6);
            color: #fff;
            transform: translateY(-3px) scale(1.02);
        }

        .hide {
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
        }

    </style>

</head>

<body>

    <canvas id="heartCanvas"></canvas>

    <div class="btn-wrapper" id="btnWrapper">
        <button id="magicBtn">Click Me</button>
    </div>

    <script>

        const LINE_DRAW_SPEED_MS = 85;

        const OUTLINE_DRAW_SPEED_MS = 30;

        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        const magicBtn = document.getElementById('magicBtn');
        const btnWrapper = document.getElementById('btnWrapper');

        const TOTAL_LINES = 120;

        let points = [];
        const scale = 17;
        let centerX, centerY;
        let originYOffset;
        let currentLine = 0;
        let outlineStep = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            centerX = canvas.width / 2;
            centerY = canvas.height / 2;

            originYOffset = centerY - (3 * scale);
        }

        window.addEventListener('resize', resize);
        resize();

        function calculatePoints() {
            points = [];

            for (let i = 0; i < TOTAL_LINES; i++) {

                const angle = i * (Math.PI * 2) / TOTAL_LINES;

                const x = 16 * Math.pow(Math.sin(angle), 3);

                const y = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));

                points.push({
                    x: x * scale,
                    y: y * scale
                });
            }
        }

        function drawStarAt(x, y, size) {

            ctx.save();

            ctx.translate(x, y);

            ctx.beginPath();

            for (let i = 0; i < 8; i++) {

                ctx.moveTo(0, 0);
                ctx.lineTo(0, -size);

                ctx.rotate((Math.PI * 2) / 8);
            }

            ctx.strokeStyle = '#ff2a5f';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.restore();
        }

        function animateLines() {

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            for (let i = 0; i < currentLine; i++) {

                const targetX = centerX + points[i].x;
                const targetY = centerY + points[i].y;

                ctx.beginPath();

                ctx.moveTo(centerX, originYOffset);
                ctx.lineTo(targetX, targetY);

                ctx.strokeStyle = 'rgba(255, 26, 85, 0.3)';
                ctx.lineWidth = 1;
                ctx.stroke();

                drawStarAt(targetX, targetY, 6);
            }

            if (currentLine < TOTAL_LINES) {

                currentLine++;

                setTimeout(animateLines, LINE_DRAW_SPEED_MS);

            } else {

                animateOutline();
            }
        }

        function animateOutline() {

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < TOTAL_LINES; i++) {

                const targetX = centerX + points[i].x;
                const targetY = centerY + points[i].y;

                ctx.beginPath();

                ctx.moveTo(centerX, originYOffset);
                ctx.lineTo(targetX, targetY);

                ctx.strokeStyle = 'rgba(255, 26, 85, 0.3)';
                ctx.lineWidth = 1;
                ctx.stroke();

                drawStarAt(targetX, targetY, 6);
            }

            ctx.beginPath();

            ctx.moveTo(
                centerX + points[0].x,
                centerY + points[0].y
            );

            for (let i = 1; i <= outlineStep; i++) {

                ctx.lineTo(
                    centerX + points[i].x,
                    centerY + points[i].y
                );
            }

            ctx.strokeStyle = '#ff1a55';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff1a55';

            ctx.stroke();

            ctx.shadowBlur = 0;

            if (outlineStep < TOTAL_LINES - 1) {

                outlineStep++;

                setTimeout(
                    animateOutline,
                    OUTLINE_DRAW_SPEED_MS
                );

            } else {

                canvas.classList.add('beating');
            }
        }

        magicBtn.addEventListener('click', () => {

            btnWrapper.classList.add('hide');

            calculatePoints();

            currentLine = 0;
            outlineStep = 0;

            setTimeout(animateLines, 300);
        });

    </script>

</body>

</html>
